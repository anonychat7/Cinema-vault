<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cinema Vault</title>
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(255, 255, 255, 0.05);
      --accent: #ffffff;
      --accent-red: #e50914;
      --text: #ffffff;
      --text-sub: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
      --nav-bg: rgba(18, 18, 24, 0.92);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 96px;
      overflow-x: hidden;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: rgba(9, 10, 15, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .brand span {
      color: var(--accent-red);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .upload-btn {
      background: var(--accent-red);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Hero Banner */
    .hero-container {
      position: relative;
      width: 100%;
      height: 55vh;
      min-height: 380px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 24px 20px;
      background: #111;
    }

    .hero-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(9,10,15,0.2) 0%, rgba(9,10,15,0.85) 75%, var(--bg) 100%);
      z-index: 2;
    }

    .hero-content {
      position: relative;
      z-index: 3;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hero-title {
      font-size: 1.6rem;
      font-weight: 800;
      line-height: 1.2;
      word-break: break-word;
    }

    .hero-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .badge {
      background: rgba(255, 255, 255, 0.15);
      padding: 2px 8px;
      border-radius: 4px;
      color: #fff;
      font-weight: 600;
      font-size: 0.75rem;
    }

    .btn-play {
      background: #fff;
      color: #000;
      border: none;
      padding: 12px 26px;
      border-radius: 99px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      margin-top: 4px;
    }

    /* Shelf Library Section */
    .section-title {
      padding: 24px 20px 12px;
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .slider-row {
      display: flex;
      gap: 14px;
      padding: 0 20px 20px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .slider-row::-webkit-scrollbar {
      display: none;
    }

    .media-card {
      flex: 0 0 160px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
    }

    .card-thumb {
      width: 100%;
      height: 200px;
      border-radius: 12px;
      background: #141419;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 12px;
      text-align: center;
    }

    .card-thumb.active-card {
      border-color: var(--accent-red);
      background: rgba(229, 9, 20, 0.1);
    }

    .card-thumb svg {
      width: 40px;
      height: 40px;
      fill: rgba(255, 255, 255, 0.6);
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Fullscreen Player Modal */
    #player-modal, #upload-modal {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 9999;
      display: none;
      flex-direction: column;
    }

    #player-modal.active, #upload-modal.active {
      display: flex;
    }

    .modal-bar {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0,0,0,0.85);
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      backdrop-filter: blur(8px);
    }

    .player-action-btn {
      background: rgba(255,255,255,0.18);
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 99px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .player-frame-box {
      width: 100%;
      height: 100%;
    }

    .player-frame-box iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Upload Dialog Styling */
    .upload-content {
      margin: auto;
      max-width: 420px;
      width: 90%;
      background: #141419;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .upload-content h2 {
      font-size: 1.3rem;
    }

    .upload-content p {
      font-size: 0.85rem;
      color: var(--text-sub);
      line-height: 1.4;
    }

    .open-drive-btn {
      background: #fff;
      color: #000;
      text-decoration: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      display: block;
    }

    /* Floating Bottom Navigation Bar */
    .bottom-nav-wrap {
      position: fixed;
      bottom: 18px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 90;
      pointer-events: none;
    }

    .bottom-nav {
      pointer-events: auto;
      background: var(--nav-bg);
      backdrop-filter: blur(20px);
      padding: 6px 10px;
      border-radius: 99px;
      display: flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }

    .nav-tab {
      padding: 8px 18px;
      border-radius: 99px;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-tab.active {
      background: #fff;
      color: #000;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">VAULT<span>.</span></div>
    <div class="top-actions">
      <button class="upload-btn" onclick="openUploadModal()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        Upload
      </button>
      <div style="font-size: 0.75rem; color: var(--text-sub);" id="file-counter">Connecting...</div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero-container">
    <div class="hero-gradient"></div>
    <div class="hero-content">
      <h1 class="hero-title" id="hero-title">Connecting to Vault...</h1>
      <div class="hero-meta">
        <span class="badge" id="hero-badge">DRIVE STREAM</span>
        <span id="hero-size">0 MB</span>
      </div>
      <button class="btn-play" onclick="playCurrent()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Play Video
      </button>
    </div>
  </section>

  <!-- Category & Media Shelf -->
  <div class="section-title">
    <h3 id="category-title">All Media</h3>
    <span id="shelf-subtitle" style="font-size:0.75rem; color:var(--text-sub);">Direct Stream</span>
  </div>
  <div class="slider-row" id="media-shelf"></div>

  <!-- Player Modal -->
  <div id="player-modal">
    <div class="modal-bar">
      <button class="player-action-btn" onclick="closePlayer()">✕ Close</button>
      <button class="player-action-btn" onclick="toggleScreenOrientation()">⛶ Rotate Screen</button>
    </div>
    <div class="player-frame-box" id="frame-holder"></div>
  </div>

  <!-- Upload Modal -->
  <div id="upload-modal">
    <div class="modal-bar">
      <button class="player-action-btn" onclick="closeUploadModal()">✕ Close</button>
    </div>
    <div class="upload-content">
      <h2>Add New Media</h2>
      <p>Upload your video files directly to the shared folder. When the upload completes, refresh this site to stream them immediately.</p>
      <a class="open-drive-btn" target="_blank" href="https://drive.google.com/drive/folders/1B4KRBty50Zm_-8Jx_Z7qVF-p-MZCVb5-">
        Open Google Drive Folder ↗
      </a>
    </div>
  </div>

  <!-- Interactive Bottom Navigation -->
  <div class="bottom-nav-wrap">
    <nav class="bottom-nav">
      <button class="nav-tab active" onclick="switchCategory('all', this)">Home</button>
      <button class="nav-tab" onclick="switchCategory('movies', this)">Movies</button>
      <button class="nav-tab" onclick="switchCategory('tv', this)">TV</button>
      <button class="nav-tab" onclick="switchCategory('4k', this)">4K</button>
    </nav>
  </div>

  <script>
    // Applied credentials:
    const FOLDER_ID = "1B4KRBty50Zm_-8Jx_Z7qVF-p-MZCVb5-".trim();
    const API_KEY = "AIzaSyC85XOzgMNTi63ltxrqx2RRAt67ZOrIY_k".trim();

    let allFiles = [];
    let displayedFiles = [];
    let currentIdx = 0;

    const shelf = document.getElementById("media-shelf");
    const heroTitle = document.getElementById("hero-title");
    const heroSize = document.getElementById("hero-size");
    const fileCounter = document.getElementById("file-counter");
    const categoryTitle = document.getElementById("category-title");
    const playerModal = document.getElementById("player-modal");
    const uploadModal = document.getElementById("upload-modal");
    const frameHolder = document.getElementById("frame-holder");

    async function loadFolderContents() {
      // Direct REST query with full drive access flags
      const url = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+trashed=false&fields=files(id,name,size,mimeType)&supportsAllDrives=true&includeItemsFromAllDrives=true&key=${API_KEY}`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.error) {
          heroTitle.textContent = "Error: " + data.error.message;
          fileCounter.textContent = "API Error";
          return;
        }

        allFiles = data.files.filter(f => 
          (f.mimeType && f.mimeType.includes("video")) || 
          f.name.match(/\.(mp4|mkv|webm|mov)$/i)
        );

        if (allFiles.length === 0) {
          heroTitle.textContent = "Folder is empty";
          fileCounter.textContent = "0 videos";
          shelf.innerHTML = "<p style='padding:20px; color:var(--text-sub);'>No videos found in this folder. Tap Upload above to add videos.</p>";
          return;
        }

        displayedFiles = [...allFiles];
        renderShelf();
      } catch (err) {
        heroTitle.textContent = "Network Error";
        console.error(err);
      }
    }

    function formatBytes(bytes) {
      if (!bytes) return "Stream";
      const mb = bytes / (1024 * 1024);
      return mb > 1000 ? (mb / 1024).toFixed(1) + " GB" : mb.toFixed(1) + " MB";
    }

    function renderShelf() {
      shelf.innerHTML = "";
      fileCounter.textContent = `${displayedFiles.length} Videos`;

      if (displayedFiles.length === 0) {
        shelf.innerHTML = "<p style='padding:20px; color:var(--text-sub);'>No videos match this category.</p>";
        heroTitle.textContent = "No Videos";
        heroSize.textContent = "0 MB";
        return;
      }

      displayedFiles.forEach((file, idx) => {
        const card = document.createElement("div");
        card.className = "media-card";
        card.onclick = () => selectItem(idx);
        card.innerHTML = `
          <div class="card-thumb ${idx === currentIdx ? 'active-card' : ''}" id="thumb-${idx}">
            <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8 12.5v-9l6 4.5-6 4.5z"/></svg>
            <span style="font-size:0.75rem; color:var(--text-sub);">${formatBytes(file.size)}</span>
          </div>
          <div class="card-title">${file.name}</div>
        `;
        shelf.appendChild(card);
      });

      selectItem(0);
    }

    function selectItem(idx) {
      if (!displayedFiles[idx]) return;
      currentIdx = idx;
      heroTitle.textContent = displayedFiles[idx].name;
      heroSize.textContent = formatBytes(displayedFiles[idx].size);

      document.querySelectorAll(".card-thumb").forEach((el, i) => {
        el.classList.toggle("active-card", i === idx);
      });
    }

    function switchCategory(cat, tabElement) {
      document.querySelectorAll(".nav-tab").forEach(tab => tab.classList.remove("active"));
      tabElement.classList.add("active");

      if (cat === "all") {
        categoryTitle.textContent = "All Media";
        displayedFiles = [...allFiles];
      } else if (cat === "movies") {
        categoryTitle.textContent = "Movies";
        displayedFiles = allFiles.filter(f => !f.name.match(/s\d{1,2}e\d{1,2}|episode|ep\d/i));
      } else if (cat === "tv") {
        categoryTitle.textContent = "TV Series & Shows";
        displayedFiles = allFiles.filter(f => f.name.match(/s\d{1,2}e\d{1,2}|episode|ep\d|season/i));
      } else if (cat === "4k") {
        categoryTitle.textContent = "4K Ultra HD";
        displayedFiles = allFiles.filter(f => f.name.match(/4k|2160p|uhd/i) || (f.size && f.size > 3000000000));
      }

      currentIdx = 0;
      renderShelf();
    }

    function playCurrent() {
      if (!displayedFiles.length) return;
      const activeFile = displayedFiles[currentIdx];
      playerModal.classList.add("active");
      frameHolder.innerHTML = `
        <iframe 
          src="https://drive.google.com/file/d/${activeFile.id}/preview" 
          allow="autoplay; fullscreen" 
          allowfullscreen>
        </iframe>
      `;
    }

    function closePlayer() {
      playerModal.classList.remove("active");
      frameHolder.innerHTML = "";
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }
      if (screen.orientation && screen.orientation.unlock) {
        screen.orientation.unlock();
      }
    }

    function openUploadModal() {
      uploadModal.classList.add("active");
    }

    function closeUploadModal() {
      uploadModal.classList.remove("active");
      loadFolderContents();
    }

    let isLandscape = false;
    async function toggleScreenOrientation() {
      try {
        if (!isLandscape) {
          if (playerModal.requestFullscreen) {
            await playerModal.requestFullscreen();
          }
          if (screen.orientation && screen.orientation.lock) {
            await screen.orientation.lock("landscape");
          }
          isLandscape = true;
        } else {
          if (document.exitFullscreen) {
            await document.exitFullscreen();
          }
          if (screen.orientation && screen.orientation.unlock) {
            screen.orientation.unlock();
          }
          isLandscape = false;
        }
      } catch (err) {
        alert("Make sure auto-rotate is enabled in your phone's notification panel.");
      }
    }

    loadFolderContents();
  </script>
</body>
</html>
